<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einkaufsliste</title>

    <link rel="stylesheet" href="styles/root.css">
    <link rel="stylesheet" href="styles/standard.css">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/lists.css">
</head>

<body>

    <main class="content-width">

        <section class="shopping-list" id="shopping-list">

            <div class="list-item" id="list-item">
                <div class="list-item-inner" id="list-item-inner">
                    <p class="lit-item-text" id="list-item-text">Milch</p>
                    <p class="lit-item-quant" id="list-item-quant">2 liter</p>

                </div>
                <div class="list-item-menu" id="list-item-menu"></div>
            </div>
            <div class="list-item" id="list-item">
                <div class="list-item-inner" id="list-item-inner">
                    <p class="lit-item-text" id="list-item-text">Haferflocken</p>
                    <p class="lit-item-quant" id="list-item-quant">1 Packung</p>

                </div>
                <div class="list-item-menu" id="list-item-menu"></div>
            </div>
            <div class="list-item" id="list-item">
                <div class="list-item-inner" id="list-item-inner">
                    <p class="lit-item-text" id="list-item-text">Äpfel</p>
                    <p class="lit-item-quant" id="list-item-quant">1 kg</p>

                </div>
                <div class="list-item-menu" id="list-item-menu"></div>
            </div>
            <div class="list-item" id="list-item">
                <div class="list-item-inner" id="list-item-inner">
                    <p class="lit-item-text" id="list-item-text">Kaffee</p>
                    <p class="lit-item-quant" id="list-item-quant">500g</p>

                </div>
                <div class="list-item-menu" id="list-item-menu"></div>
            </div>
            <div class="list-item" id="list-item">
                <div class="list-item-inner" id="list-item-inner">
                    <p class="lit-item-text" id="list-item-text">Chips</p>
                    <p class="lit-item-quant" id="list-item-quant">3 Tüten</p>

                </div>
                <div class="list-item-menu" id="list-item-menu"></div>
            </div>
            <div class="list-item" id="list-item">
                <div class="list-item-inner" id="list-item-inner">
                    <p class="lit-item-text" id="list-item-text">Cola</p>
                    <p class="lit-item-quant" id="list-item-quant">6 Flaschen</p>

                </div>
                <div class="list-item-menu" id="list-item-menu"></div>
            </div>
            <div class="list-item" id="list-item">
                <div class="list-item-inner" id="list-item-inner">
                    <p class="lit-item-text" id="list-item-text">Servietten</p>
                    <p class="lit-item-quant" id="list-item-quant">1 Packung</p>

                </div>
                <div class="list-item-menu" id="list-item-menu"></div>
            </div>


        </section>

        <section class="main-menu" id="main-menu">

            <div class="menu-tab" id="menu-tab"></div>
            <div class="menu-tab" id="menu-tab"></div>
            <div class="menu-tab" id="menu-tab"></div>

        </section>

    </main>




    <script src="scripts/script.js"></script>
</body>

</html>
