<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einkaufsliste</title>

    <link rel="stylesheet" href="styles/root.css">
    <link rel="stylesheet" href="styles/standard.css">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/lists.css">
    <link rel="stylesheet" href="styles/responsive.css">

</head>

<body>

    <div class="dialog-bg d-none" id="dialog-bg" onclick="closeDialog()"></div>

    <main class="content-width app-content-height shopping-list-main">

        <h1 class="shopping-list-header">Einkaufsliste</h1>

        <section class="shopping-list" id="shopping-list">
            <!--Wir werden die list-items in einer Schleife rendern und i übergeben-->
            <div class="list-item" id="list-item-${i}">
                <div class="list-item-entry">
                    <p class="list-item-text">Milch</p>
                    <p class="list-item-quant">2 Liter</p>
                    <!-- this: das aktuelle Element auf das wir klicken - somit übergeben wir das Element, welches das 3-Punkte-Menü öffnen soll -->
                </div>
                <div class="list-item-menu">
                    <!-- <p onclick="openDialog(this, ${i})">&#8942;</p> -->
                    <p onclick="openDialog()">&#8942;</p>
                    <div class="list-dialog d-none" id="list-dialog">
                        <ul>
                            <li>Löeschen</li>
                            <li>Bearbeiten</li>
                            <li>Archivieren</li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="list-item">
                <div class="list-item-entry">
                    <p class="list-item-text">Haferflocken</p>
                    <p class="list-item-quant">1 Packung</p>

                </div>
                <div class="list-item-menu">
                    <p>&#8942;</p>
                </div>
            </div>
            <div class="list-item">
                <div class="list-item-entry">
                    <p class="list-item-text">Äpfel</p>
                    <p class="list-item-quant">1 kg</p>

                </div>
                <div class="list-item-menu">
                    <p>&#8942;</p>
                </div>
            </div>
            <div class="list-item">
                <div class="list-item-entry">
                    <p class="list-item-text">Kaffee</p>
                    <p class="list-item-quant">500g</p>

                </div>
                <div class="list-item-menu">
                    <p>&#8942;</p>
                </div>
            </div>
            <div class="list-item">
                <div class="list-item-entry">
                    <p class="list-item-text">Chips</p>
                    <p class="list-item-quant">3 Tüten</p>

                </div>
                <div class="list-item-menu">
                    <p>&#8942;</p>
                </div>
            </div>
            <div class="list-item">
                <div class="list-item-entry">
                    <p class="list-item-text">Cola</p>
                    <p class="list-item-quant">6 Flaschen</p>

                </div>
                <div class="list-item-menu">
                    <p>&#8942;</p>
                </div>
            </div>
            <div class="list-item">
                <div class="list-item-entry">
                    <p class="list-item-text">Servietten</p>
                    <p class="list-item-quant">1 Packung</p>

                </div>
                <div class="list-item-menu">
                    <p>&#8942;</p>
                </div>
            </div>


        </section>

        <section class="list-main-menu" id="main-menu">

            <div class="menu-tab">
                <p>Menü</p>
            </div>
            <div class="menu-tab">
                <p>Auswahl</p>
            </div>
            <div class="menu-tab">
                <p>Zurück</p>
            </div>

        </section>

    </main>


    <script src="scripts/script.js"></script>
    <script src="scripts/list.js"></script>
</body>

</html>
